---
# Consul HTTP API / UI (8500) on the server nodes is intentionally NOT opened to
# the world. Internal hosts already get full access via the per-host allow rules
# applied by the `ufw` role (every inventory host is allowlisted). Admins reach the
# UI through an SSH tunnel: `ssh -i <docker.key> -L 8500:127.0.0.1:8500 nb@<server>`
# then browse http://localhost:8500 — no IP allowlisting needed.
# A blanket `ufw allow 8500` here previously exposed the API to the public internet
# (Consul ACLs are disabled), which let an external scanner register services and
# write to the KV store. Do not re-add it.

- name: Create config file
  become: yes
  template:
    src: consul_manager.json.j2
    dest: /etc/consul.d/newsblur.json
  notify:
    - restart consul

- name: Start Consul
  become: yes
  service:
    name: consul
    state: started
    enabled: true
        
- name: Register consul-manager in consul
  tags: consul
  become: yes
  template:
    src: consul_service.json
    dest: /etc/consul.d/consul-manager.json
  notify:
    - reload consul
