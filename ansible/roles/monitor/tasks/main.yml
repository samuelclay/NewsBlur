---
- name: Copy common secrets
  copy:
    src: /srv/secrets-newsblur/settings/common_settings.py
    dest: /srv/newsblur/newsblur_web/local_settings.py
  register: app_changed
  tags: env

- name: Copy app env
  copy:
    src: /srv/secrets-newsblur/settings/app_env.py
    dest: /srv/newsblur/newsblur_web/app_env.py
  register: app_changed

- name: Add SERVER_NAME to app env
  lineinfile:
    path: /srv/newsblur/newsblur_web/app_env.py
    line: 'SERVER_NAME = "{{ inventory_hostname }}"'

- name: Start monitor docker container
  become: yes
  docker_container:
    name: monitor
    image: newsblur/newsblur_monitor:latest
    pull: yes
    state: started
    command: bash -c "/venv/bin/python /srv/newsblur/flask_monitor/db_monitor.py"
    hostname: "{{ inventory_hostname }}"
    restart_policy: unless-stopped
    container_default_behavior: no_defaults
    # A fresh monitor is ~105MB. Left unbounded it reached 4.5GB in three weeks
    # on hdb-mongo-secondary-3 and helped OOM the host, so cap it and let it
    # restart instead of taking the box down. MALLOC_ARENA_MAX limits glibc's
    # per-thread arenas, which is where the growth actually accumulates: the dev
    # server handles each request on a new thread and glibc never returns those
    # arenas to the OS.
    memory: 512m
    memory_swap: 512m
    env:
      MALLOC_ARENA_MAX: "2"
    volumes:
      - /srv/newsblur:/srv/newsblur
    network_mode: host
    dns_servers:
      - 127.0.0.1

- name: Restart monitor
  become: yes
  shell:
    cmd: docker restart monitor
