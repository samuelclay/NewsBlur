- name: Pull newsblur_web github
  git:
    repo: https://github.com/samuelclay/NewsBlur.git
    dest: /srv/newsblur/
    version: main
    # Staging stays shallow (ansible/group_vars/staging.yml); other servers fetch normally.
    depth: "{{ git_depth | default(omit) }}"
    refspec: "{{ git_refspec | default(omit) }}"
