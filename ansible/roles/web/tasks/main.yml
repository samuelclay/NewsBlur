---
- name: Allow haproxy stats port
  ufw: rule=allow port={{ item }}
  become: yes
  tags: ufw
  with_items:
    - "8000"

- name: Copy common secrets
  copy:
    src: /srv/secrets-newsblur/settings/common_settings.py
    dest: /srv/newsblur/newsblur_web/local_settings.py
  register: app_changed
  tags: env

- name: Ensure private web configuration directory exists
  file:
    path: /srv/newsblur/config/secrets
    state: directory
    mode: "0700"
  tags: env

- name: Copy Sign in with Apple signing key
  copy:
    src: /srv/secrets-newsblur/keys/apple-signin.p8
    dest: /srv/newsblur/config/secrets/apple-signin.p8
    mode: "0600"
  no_log: true
  tags: env

- name: Enable browser sign-in with staging callbacks
  blockinfile:
    path: /srv/newsblur/newsblur_web/local_settings.py
    marker: "# {mark} STAGING SOCIAL AUTH CALLBACKS"
    block: |
      # web/tasks/main.yml keeps provider redirects on the initiating staging site.
      SOCIAL_WEB_ENABLED = True
      SOCIAL_GOOGLE_REDIRECT_URI = "https://staging.newsblur.com/api/social/google/callback"
      SOCIAL_APPLE_REDIRECT_URI = "https://staging.newsblur.com/api/social/apple/callback"
      SOCIAL_GOOGLE_WEB_REDIRECT_URI = "https://staging.newsblur.com/account/social/google/callback"
      SOCIAL_APPLE_WEB_REDIRECT_URI = "https://staging.newsblur.com/account/social/apple/callback"
  when: "'staging' in group_names"
  tags: env

- name: Copy app env
  copy:
    src: /srv/secrets-newsblur/settings/app_env.py
    dest: /srv/newsblur/newsblur_web/app_env.py

- name: Add SERVER_NAME to app env
  lineinfile:
    path: /srv/newsblur/newsblur_web/app_env.py
    line: 'SERVER_NAME = "{{ inventory_hostname }}"'

- name: Ensure static dir exists
  file:
    path: /srv/newsblur/static
    state: directory
  tags:
    - static

- name: "Write out ips from ansible inventory of all servers with app/node/www/task in name into addresses.txt file"
  template:
    src: ip_addresses.txt.j2
    dest: /srv/newsblur/apps/api/ip_addresses.txt
  tags:
    - inventory

- name: Prune docker
  become: yes
  community.docker.docker_prune:
    containers: yes
    images: yes
    builder_cache: yes
    timeout: 300
  tags:
    - prune
    - never

- name: Install pip
  become: yes
  apt: name=python3-pip state=latest
  tags:
    - static

- name: Install boto3, botocore, and packaging with pip3 module
  pip:
    name:
      - boto3
      - botocore
      - packaging
  tags:
    - static

- name: Update to latest NewsBlur Web Docker image
  become: yes
  docker_image:
    name: newsblur/newsblur_python3
    source: pull

- include_tasks: container.yml

- name: Register web app in consul
  tags: consul
  become: yes
  template:
    src: consul_service.json
    dest: /etc/consul.d/newsblur_web.json
  when: disable_consul_services_ie_staging is not defined
  notify:
    - reload consul

- name: Setup logrotate
  become: yes
  copy: src=logrotate.conf dest=/etc/logrotate.d/newsblur mode=0755
  tags:
    - logrotate

- name: Force reload gunicorn
  debug:
    msg: Forcing reload...
  register: app_changed
  changed_when: true
  tags:
    - never
    - force

- name: Reload gunicorn
  debug:
    msg: Reloading gunicorn
  notify: reload gunicorn
  when: app_changed.changed
  changed_when: app_changed.changed
