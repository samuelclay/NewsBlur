name: Claude PR Review

# Automated review of every pull request commit. Runs on open, reopen, ready for
# review, and each push to the PR branch (synchronize); never on pushes to main.
# Copied from the Tavus developer-portal workflow of the same name and adapted for
# NewsBlur. .github/workflows/claude-pr-review.yml
#
# The first review of a PR reads the whole diff against main. Every later push is
# reviewed incrementally: .github/scripts/pr-review-scope.sh finds the head of the last
# successful run of this workflow on the PR and hands Claude only the changes since
# then, so a PR that goes through ten fix-and-push rounds is not re-read in full each
# time. A `claude-full-review` label on the PR forces a full review.
#
# Runs on the Claude Max subscription through CLAUDE_CODE_OAUTH_TOKEN (generated with
# `claude setup-token`), not the API key, so reviews draw from the plan's usage limits
# instead of the API bill.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  # Listing this workflow's earlier successful runs is how the scope step finds the
  # last reviewed head.
  actions: read
  # Required by claude-code-action@v1, which fetches an OIDC token even when
  # authenticating with a static credential. Without it the action aborts.
  id-token: write

concurrency:
  # A new push cancels the review of the previous head so comments land on current code.
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # Full commit and tree history without blobs (about 16 MB for this repo)
          # so pr-review-scope.sh can merge the previously reviewed head against the
          # current base. Blobs are fetched on demand when a diff needs them; the repo
          # is public, so those fetches work without persisted credentials.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"

      - name: Work out what to review
        id: scope
        env:
          REVIEWER: claude
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: .github/scripts/pr-review-scope.sh

      - name: Claude code review
        id: claude_review
        # Nothing to review when the head was already reviewed or a push only merged main.
        if: steps.scope.outputs.mode != 'skip'
        # The pinned release installs its own Claude Code (base-action/action.yml
        # CLAUDE_CODE_VERSION), which has to be new enough for the --model below:
        # claude-opus-5-5 needs 2.1.280 or newer and v1.0.237 installs 2.1.285.
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review text is public on the PR anyway; full output puts the API error in
          # the job log when a run fails instead of a bare is_error:true.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            You are reviewing NewsBlur, an open source RSS news reader.

            Business context:
            - Django 3 backend (apps/ and utils/) with PostgreSQL, MongoDB (mongoengine), Redis, and Elasticsearch, run in Docker and deployed with Ansible to Hetzner. Feed fetching, story scoring, newsletters, and Ask AI run as Celery tasks.
            - Web frontend is Backbone.js with jQuery and Underscore under media/js/newsblur/ (snake_case methods), with Node services under node/ for text extraction, favicons, and real-time.
            - Native clients: iOS/macOS under clients/ios (Swift and Objective-C) and Android under clients/android (Kotlin and Java).
            - Read CLAUDE.md at the repo root for conventions before judging style.
            - A bug in feed fetching, story deduplication, unread counts, or payments hits every subscriber at once. Treat those, and anything that could leak user data, as high severity.

            Review objective:
            - Perform a general code review for correctness, security, performance at NewsBlur's scale, maintainability, and tests on the changes in scope below.

            Review scope:
            - The workspace is checked out to the PR merge commit.
            ${{ steps.scope.outputs.instructions }}

            Focus areas (in order):
            1) Correctness and data safety
            - Django ORM and mongoengine queries that scan large tables (feeds, stories, subscriptions) without an index, N+1 loops, or writes inside fetch paths that run millions of times a day
            - Race conditions in Celery tasks, Redis pipelines, and story hashing; changes to story_hash, feed_address, or unread logic
            - Unhandled None, encoding errors on real-world feed data, timeouts on outbound HTTP (feed fetching must never hang a worker)
            - Tests: new behavior needs a Test_* class with test_* methods; mocks must patch the module under test
            2) Security
            - SSRF on any outbound fetch (utils/url_safety.py validate_public_url and safe_requests_get must guard user-supplied URLs)
            - XSS in story content rendering, template autoescape bypasses, unsafe HTML scrubbing changes
            - Secrets or user email addresses in logs, PR text, or fixtures; auth checks on views that touch another user's data
            3) Product and style
            - Follows CLAUDE.md: Black at 110 columns, explicit exceptions, comments that name the file, no TODOs or placeholders, readability over cleverness
            - User-facing copy is plain and human; forum reply drafts in PR bodies are not reviewed for tone
            - Android UI changes cover light, dark, and black themes; iOS additions are Swift

            Output requirements:
            - Leave inline comments for concrete issues.
            - Do not repeat already-reported inline issues unless the code changed or there is new evidence.
            - Provide a final summary grouped by severity: Critical, High, Medium, Low.
            - Start the summary with this line, verbatim: ${{ steps.scope.outputs.scope_line }}
            - For each Critical/High issue include why it matters (user impact) and a specific fix suggestion.
            - If no major risks are found, explicitly state why this PR is low risk.
            - Write the summary and every comment in plain language: most important point first, short sentences, active voice, project shorthand expanded on first use, and a concrete next step for the author.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read"
