name: Agent secrets

on:
  pull_request:

permissions:
  contents: read

jobs:
  gglint:
    name: gglint secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # agent-secrets.yml pins the commit because the v1 tag moves with each gglint release.
      # This commit installs gglint 0.5.0 from PyPI. Bump both together.
      - uses: corridor/gglint@9278459056c06dc160a06a7b178dfc228b967f59 # v0.5.0
        with:
          command: secrets
          comment: "false"
