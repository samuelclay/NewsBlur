{% load i18n %}
<form method="post" action="{% url 'language-preference' %}" class="NB-language-selector">
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <select id="NB-login-language" name="language" onchange="this.form.submit()" aria-label="{% trans 'Language' %}">
    <option value="auto" lang="{{ ui_detected_language }}" {% if ui_language_preference == 'auto' %}selected{% endif %}>{{ ui_language_auto_short }} · {{ ui_detected_language_name }}</option>
    {% for code, name in ui_languages %}
      <option value="{{ code }}" lang="{{ code }}" {% if ui_language_preference == code %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit">{% trans "Save" %}</button></noscript>
</form>
