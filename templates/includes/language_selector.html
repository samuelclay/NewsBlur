{% load i18n %}
<form method="post" action="{% url 'language-preference' %}" class="NB-language-selector">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <select id="NB-login-language" name="language" onchange="this.form.submit()" aria-label="{% trans 'Language' %}">
    <option value="auto" {% if ui_language_preference == 'auto' %}selected{% endif %}>{% trans "Auto" %}{% for code, name in ui_languages %}{% if code == ui_language %} · {{ name }}{% endif %}{% endfor %}</option>
    {% for code, name in ui_languages %}
      <option value="{{ code }}" {% if ui_language_preference == code %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit">{% trans "Save" %}</button></noscript>
</form>
