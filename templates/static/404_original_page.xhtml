{% load i18n %}{% get_current_language as LANGUAGE_CODE %}{% get_current_language_bidi as LANGUAGE_BIDI %}
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <title>{% trans "4-oh-4, not found" %}</title>
</head>
<body>
    <script>
        if (window.top == window) {
            var feed_id = window.location.href.replace(/[^\d+]/g, '');
            window.location.href = '/site/' + feed_id + '/';
        } else if (window.top.NEWSBLUR) {
            window.top.NEWSBLUR.reader.switch_taskbar_view('feed');
        }
    </script>
</body>
</html>
