<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.story { position: absolute; left: 70px; top: 60px; width: 640px; background: #fff; border-radius: 22px;
  box-shadow: 0 24px 50px rgba(40,46,30,0.14), 0 0 0 1px rgba(40,46,30,0.06); padding: 34px 38px; }
.block { position: relative; border-radius: 12px; padding: 12px 14px; margin: 0 -14px 14px; }
.block .line { height: 13px; border-radius: 7px; background: #dcdcd4; margin: 9px 0; }
.block.title .line { height: 22px; background: #3a3d35; margin: 6px 0; }
.block.done .line { background: #cfd8c6; }
.block.playing { background: #fbefc2; }
.block.playing .line { background: #c9b675; }
.block.later { opacity: 0.45; }
.tag { position: absolute; left: 700px; display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 600; color: #3a3d35; white-space: nowrap; }
.tag small { display: block; font-size: 19px; font-weight: 500; color: rgba(58,61,53,0.55); margin-top: 3px; }
.dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.connector { position: absolute; height: 2px; background: rgba(58,61,53,0.18); }
</style></head><body>
<div class="stage" style="width:1400px;height:800px">
  <div class="story">
    <div class="block title done" id="b0"><div class="line" style="width:88%"></div><div class="line" style="width:55%"></div></div>
    <div class="block done" id="b1"><div class="line"></div><div class="line"></div><div class="line" style="width:72%"></div></div>
    <div class="block playing" id="b2"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line" style="width:46%"></div></div>
    <div class="block" id="b3"><div class="line"></div><div class="line" style="width:80%"></div></div>
    <div class="block later" id="b4"><div class="line"></div><div class="line"></div><div class="line" style="width:64%"></div></div>
    <div class="block later" id="b5"><div class="line"></div><div class="line" style="width:38%"></div></div>
  </div>
  <div id="tags"></div>
</div>
<script>
var tags = [
  [['b0', 'b1'], '#8fb27a', 'Played', 'Saved, so the next listener gets it right away'],
  [['b2'], '#e0b93c', 'Playing now', 'Highlighted as it\u2019s read'],
  [['b3'], '#6e9c55', 'Streaming', 'Generated by ElevenLabs while you listen'],
  [['b4', 'b5'], '#c9c9c0', 'Not made yet', 'Only made if you get this far']
];
var stage = document.querySelector('.stage');
tags.forEach(function (t) {
  var first = document.getElementById(t[0][0]).getBoundingClientRect();
  var last = document.getElementById(t[0][t[0].length - 1]).getBoundingClientRect();
  var rect = { right: document.querySelector('.story').getBoundingClientRect().right };
  var mid = (first.top + last.bottom) / 2;
  if (t[0].length > 1) {
    var bracket = document.createElement('div');
    bracket.className = 'connector';
    bracket.style.cssText = 'left:' + (rect.right + 22) + 'px;top:' + (first.top + 8) + 'px;height:' + (last.bottom - first.top - 16) + 'px;width:2px';
    stage.appendChild(bracket);
  }
  var connector = document.createElement('div');
  connector.className = 'connector';
  connector.style.left = (rect.right + 22) + 'px';
  connector.style.width = (700 - rect.right - 22 + 140) + 'px';
  connector.style.top = mid + 'px';
  var tag = document.createElement('div');
  tag.className = 'tag';
  tag.style.left = '880px';
  tag.innerHTML = '<span class="dot" style="background:' + t[1] + '"></span><span>' + t[2] + (t[3] ? '<small>' + t[3] + '</small>' : '') + '</span>';
  stage.appendChild(connector);
  stage.appendChild(tag);
  tag.style.top = (mid - tag.getBoundingClientRect().height / 2) + 'px';
  connector.style.width = (880 - 14 - rect.right - 22) + 'px';
});
</script>
</body></html>
