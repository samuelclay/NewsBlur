<figure style="margin: 28px auto; width: 310px; max-width: 85%; text-align: center;">
  <a href="{{ include.image | relative_url }}" style="display: block; position: relative; padding: 11px; border: 2px solid #777a7e; border-radius: 43px; background: #191a1c; box-shadow: 0 12px 28px rgba(0,0,0,0.18);">
    <span aria-hidden="true" style="position: absolute; left: -5px; top: 110px; width: 3px; height: 58px; border-radius: 2px 0 0 2px; background: #55585c;"></span>
    <span aria-hidden="true" style="position: absolute; right: -5px; top: 140px; width: 3px; height: 44px; border-radius: 0 2px 2px 0; background: #55585c;"></span>
    <img src="{{ include.image | relative_url }}" alt="{{ include.alt | escape }}" style="display: block; width: 100%; height: auto; border-radius: 30px;" loading="lazy">
  </a>
  <figcaption style="margin-top: 16px; font-size: 14px; line-height: 1.5;">{{ include.caption }}</figcaption>
</figure>
