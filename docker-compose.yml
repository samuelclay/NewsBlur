services:
  newsblur_web:
    hostname: nb.com
    container_name: newsblur_web
    image: newsblur/newsblur_${NEWSBLUR_BASE:-python3}:latest
    build:
      context: .
      dockerfile: docker/newsblur_base_image.Dockerfile
    # user: "${CURRENT_UID}:${CURRENT_GID}"
    environment:
      - DOCKERBUILD=True
      - RUNWITHMAKEBUILD=${RUNWITHMAKEBUILD:-True}
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis
      - newsblur_db_elasticsearch
    ulimits:
      nproc: 10000
      nofile:
        soft: 10000
        hard: 10000
    ports:
      - 8000:8000
    # only use gunicorn if the TEST env variable is not "True"
    entrypoint: /bin/sh -c newsblur_web/entrypoint.sh
    volumes:
      - ${PWD}:/srv/newsblur

  newsblur_node:
    container_name: newsblur_node
    image: newsblur/newsblur_node:latest
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    environment:
      - NODE_ENV=docker
      - MONGODB_PORT=29019
    command: node newsblur.js
    restart: unless-stopped
    stop_signal: HUP
    depends_on:
      - newsblur_db_mongo
      - newsblur_db_postgres
      - newsblur_db_redis
    ports:
      - 8008:8008
    volumes:
      - ${PWD}/node:/srv
      - ${PWD}/node/originals:/srv/originals

  imageproxy:
    container_name: newsblur_imageproxy
    image: ghcr.io/willnorris/imageproxy:latest # Multi-arch (amd64/arm64); use this unless it breaks on your platform
    # image: yusukeito/imageproxy:v0.11.2 # arm64-only fork; use if the image above doesn't work for you
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    entrypoint: /app/imageproxy -addr 0.0.0.0:8088 -cache /tmp/imageproxy -verbose
    restart: unless-stopped
    ports:
      - 8088:8088
    volumes:
      - /tmp:/tmp/imageproxy

  nginx:
    container_name: newsblur_nginx
    image: nginx:1.19.6
    restart: unless-stopped
    ports:
      - 81:81
    depends_on:
      - newsblur_web
      - newsblur_node
      - newsblur_db_postgres
      - newsblur_db_redis
      - newsblur_db_mongo
      - newsblur_db_elasticsearch
    environment:
      - DOCKERBUILD=True
    volumes:
      - ./docker/nginx/nginx.local.conf:/etc/nginx/conf.d/nginx.conf
      - ${PWD}:/srv/newsblur

  newsblur_db_postgres:
    container_name: newsblur_db_postgres
    image: postgres:13.1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=newsblur
      - POSTGRES_PASSWORD=newsblur
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U newsblur"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    ports:
      - 5434:5432
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql/data

  newsblur_db_redis:
    container_name: newsblur_db_redis
    image: redis:latest
    ports:
      - 6579:6579
    restart: unless-stopped
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf
      - ./docker/redis/redis_server.conf:/usr/local/etc/redis/redis_replica.conf
      - ./docker/volumes/redis:/data
    command: redis-server /etc/redis/redis.conf --port 6579

  # Prod Redis
  # db_redis:
  #   container_name: db_redis
  #   image: redis:latest
  #   ports:
  #     - 6579:6579
  #   restart: unless-stopped
  #   volumes:
  #     - ./docker/redis/redis.conf:/etc/redis/redis.conf
  #     - ./docker/redis/redis_server.conf:/usr/local/etc/redis/redis_replica.conf
  #     - ./docker/volumes/redis_prod:/data
  #   command: redis-server /etc/redis/redis.conf --port 6579

  # One-shot init step: chowns the bind-mounted data dir to the image's
  # built-in elasticsearch user (uid 1000, gid 0) before Elasticsearch starts.
  # Docker auto-creates a missing bind-mount host directory as root, and this
  # image's entrypoint never chowns its own data dir on boot - it always execs
  # directly as its non-root user. Docker Desktop's bind-mount layer papers
  # over the resulting ownership mismatch; native Linux Docker Engine enforces
  # real UID permissions, so a genuinely fresh clone fails there with an
  # AccessDeniedException obtaining the node lock. Idempotent and harmless on
  # every host, including Desktop, so it doesn't need an OS check.
  newsblur_db_elasticsearch_permissions:
    container_name: newsblur_db_elasticsearch_permissions
    image: alpine:latest
    command: chown -R 1000:0 /usr/share/elasticsearch/data
    volumes:
      - ./docker/volumes/elasticsearch:/usr/share/elasticsearch/data
    restart: "no"

  newsblur_db_elasticsearch:
    container_name: newsblur_db_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    user: "1000:0" # the image's own built-in user; not host-dependent
    depends_on:
      newsblur_db_elasticsearch_permissions:
        condition: service_completed_successfully
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    # See docker/elasticsearch/entrypoint.sh: only adds the ARM-only
    # -XX:UseSVE=0 JVM flag when actually running on arm64, instead of
    # hardcoding it (crashes on x86_64) or blanket-suppressing all
    # unrecognized JVM options as a workaround.
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms384m -Xmx384m"
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
      - bootstrap.memory_lock=false
      - indices.breaker.total.use_real_memory=false
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - ./docker/elasticsearch/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/volumes/elasticsearch:/usr/share/elasticsearch/data
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml

  # Dejavu is a web UI for Elasticsearch
  dejavu:
    container_name: newsblur_dejavu
    image: appbaseio/dejavu:3.6.0
    restart: unless-stopped
    ports:
      - 1358:1358

  newsblur_db_mongo:
    container_name: newsblur_db_mongo
    image: mongo:4.0
    restart: unless-stopped
    ports:
      - 29019:29019
    command: mongod --port 29019 --wiredTigerEngineConfigString="checkpoint=(wait=60),file_manager=(close_idle_time=0)"
    volumes:
      - ./docker/volumes/db_mongo:/data/db:delegated

  task_celery:
    container_name: newsblur_celery
    image: newsblur/newsblur_python3
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    command: "celery worker -A newsblur_web -B --loglevel=INFO"
    restart: unless-stopped
    volumes:
      - ${PWD}:/srv/newsblur
    environment:
      - DOCKERBUILD=True

  newsblur_mcp:
    container_name: newsblur_mcp
    build:
      context: ./newsblur_mcp
    restart: unless-stopped
    environment:
      - PYTHONPATH=/srv/newsblur_mcp
      - NEWSBLUR_BASE_URL=http://newsblur_web:8000
      - MCP_PORT=8099
      - MCP_HOST=0.0.0.0
      - MCP_OAUTH_CLIENT_ID=newsblur-mcp-server
      - MCP_OAUTH_CLIENT_SECRET=newsblur-mcp-dev-secret
      - MCP_OAUTH_BASE_URL=http://localhost/mcp
      - MCP_OAUTH_UPSTREAM_URL=http://localhost
      - MCP_OAUTH_INTERNAL_URL=http://newsblur_web:8000
      - MCP_REDIS_URL=redis://newsblur_db_redis:6579/5
    volumes:
      - ${PWD}/newsblur_mcp/newsblur_mcp:/srv/newsblur_mcp/newsblur_mcp
    depends_on:
      - newsblur_web

  haproxy:
    container_name: newsblur_haproxy
    image: haproxy:latest
    restart: unless-stopped
    # host.docker.internal is provided automatically on Docker Desktop (Mac/Windows) but
    # not on native Linux Docker Engine. This makes the camera_monitor backend resolvable
    # on Linux too, instead of just failing its health check.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nginx
      - newsblur_web
      - newsblur_node
      - imageproxy
      - newsblur_db_redis
      - newsblur_db_postgres
      - newsblur_db_elasticsearch
      - newsblur_db_mongo
    ports:
      - 80:80
      - 443:443
      - 1936:1936
    volumes:
      - ./docker/haproxy/haproxy.docker-compose.cfg:/usr/local/etc/haproxy/haproxy.cfg
      - ${PWD}:/srv/newsblur
